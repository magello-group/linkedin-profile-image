server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers. They are set at server level, so a location block that
    # adds its own add_header must repeat them (nginx does not inherit them).
    # The CSP allows Google Fonts, and data:/blob: images because uploaded
    # pictures are read with FileReader and drawn on canvas in the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Serve the actual file/directory if it exists (e.g. hashed JS/CSS bundles,
    # images in /public), otherwise fall back to index.html so React Router
    # can handle the route client-side. Without this, a direct request or a
    # page refresh on a path like /svg-crop 404s at the nginx level before
    # the SPA ever gets a chance to load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
